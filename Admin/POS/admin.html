<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN POS</title>
    <link rel="stylesheet" href="admin.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <div id="navbar">
        <nav style="display: flex; gap: 20px; list-style: none; padding: 15px; background: #f5f1ed; border-bottom: 2px solid #e1dbd6;">
            <li style="cursor: pointer;"><a href="pengaturan_stok.html">Lihat Stok</a></li>
            <li id="info-hari-ini" style="font-weight: bold; color: #2e7d32">Membuat data transaksi..</li>
        </nav>
    </div>

    <div class="layar-pos">

        <div class="kiri-scanner">
            <h2>Scanner Kasir</h2>
            <p>Arahkan QR Code pelanggan ke sini</p>

            <div id="reader"></div>
        </div>

        <div class="kanan-kasir">
            <h2>Mesin Kasir (POS)</h2>
            <p id="info-pesanan">Status: <span style="color: #d32f2f;">Menunggu Pindaian</span></p>

            <!-- table -->
            <table>
                <thead>
                    <tr>
                        <th>Menu</th>
                        <th>Qty</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody id="isi-tabel">
                </tbody>
            </table>
            <!-- table end -->

            <!-- kalkulator start -->
            <div class="kalkulator">
                <div class="baris-kalkulator">
                    <span>Total Tagihan:</span>
                    <strong id="total-tagihan" style="font-size: 18px;">Rp 0</strong>
                </div>
                <div class="baris-kalkulator" style="margin-top: 15px;">
                    <span>Uang Diterima:</span>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <strong>Rp</strong>
                        <input type="number" id="uang-diterima" placeholder="0" disabled>
                    </div>
                </div>
                     <hr style="margin: 15px 0; border: 0; border-top: 2px dashed #d1c9c2;">
                     <div class="baris-kalkulator">
                        <span style="color: #2e7d32; font-weight: bold;">Kembalian:</span>
                        <strong id="kembalian" style="color: #2e7d32; font-size: 18px;">Rp 0</strong>
                    </div>
            <!-- Kalkulator end -->

                    <button id="btn-proses" disabled>Selesaikan Pesanan</button>
                </div>
        </div>
    </div>
    
    <script src="../JS/admin.js"></script>
</body>
</html>
