<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran</title>
  <link rel="stylesheet" href="pembayaran.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <!-- Jenis Pesanan -->
  <table id="jenis-pesanan" >

  </table>
   <!-- Pilih jenis Pembayaran -->
  <h3>Pilih Pembayaran</h3>
    <select class="pilihan-byr">
      <option id="csh">Cash</option>
      <option id="qr">QR</option>
    </select>   
    <!-- untuk qr -->
    <div id="cash-section" style="display: none; text-align: center; margin-bottom: 20px;">
      <p style="font-size: 13px; margin-bottom: 10px; color: #8a7e74;">Tunjukkan QR Pesanan ini ke kasir:</p>
      <div id="qrcode" style="display: flex; justify-content: center;"></div>
    </div>

    <div id="qr-section" style="display: none; text-align: center; margin-bottom: 20px;">
      <p style="font-size: 13px; margin-bottom: 10px; color: #8a7e74;">Silakan scan QRIS di bawah ini untuk membayar:</p>
      <div class="dummy-qris"><b>QRIS Dummy</b></div>
    <button id="btn-sudah-bayar" class="btn-hijau">Konfirmasi Sudah Dibayar</button>
    </div>
    <!-- Konfirmasi Pembayaran -->
     <a href="../Detail_pesanan/detail.html">
      <!-- Logic in hir -->
     <button class="okk">Konfirmasi Pembayaran</button>
     </a>

  <script src="../JS/pembayaran.js"></script>
</body>
</html>
