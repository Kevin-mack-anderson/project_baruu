<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran</title>
  <link rel="stylesheet" href="pembayaran.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <!-- Jenis Pesanan -->
  <table id="jenis-pesanan" >

  </table>
   <!-- Pilih jenis Pembayaran -->
  <h3>Pilih Pembayaran</h3>
    <select class="pilihan-byr">
      <option id="csh">Cash</option>
      <option id="qr">QR</option>
    </select>   
    <!-- untuk qr -->
    <button id="btn-konfirmasi" class="okk">Konfirmasi Pembayaran</button>
    <div id="cash-section" style="display: none; text-align: center; margin-bottom: 20px;">
      <p style="font-size: 13px; margin-bottom: 10px; color: #8a7e74;">Pesanan Terkunci, Tunjukkan QR Pesanan ini ke kasir:</p>
      <div id="qrcode" style="display: flex; justify-content: center;"></div>
      <a href="../Detail_pesanan/detail.html" style="margin-top :15px;">
        <button class="btn-hijau">Selesai / Lanjut</button>
      </a>
    </div>

    <div id="qr-section" style="display: none; text-align: center; margin-bottom: 20px;">
      <p style="font-size: 13px; margin-bottom: 10px; color: #8a7e74;">Silakan scan QRIS di bawah ini untuk membayar (Berlaku 1 Menit):</p>
      <p id="timer-display" style="font-size: 18px; font-weight: bold; color: #d32f2f; margin-bottom: 10px;">01.00</p>
      <div class="dummy-qris" id="qris-box" style="border: none; background: transparent; display: flex; justify-content: center;"></div>
      <p id="expired-msg" style="display: none; color: #d32f2f; font-weight: bold; font-size: 14px; margin-bottom: 15px;">Waktu Habis</p>
      <button id="btn-sudah-bayar" class="btn-hijau">Konfirmasi Sudah Dibayar</button>
    </div>
    
     

  <script src="../JS/pembayaran.js"></script>
</body>
</html>
