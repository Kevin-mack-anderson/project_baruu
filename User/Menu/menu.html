                    <div class="menu-card" data-category="minuman" onclick="add('Kopi Susu', 12000)">

                    </div>
                    
                    <div class="menu-card" data-category="minuman" onclick="add('Matcha Latte', 18000)">

                    </div>
                    
                    <div class="menu-card" data-category="snack" onclick="add('Roti Bakar', 12000)">

                    <div class="menu-card" data-category="makanan" onclick="add('Mie Goreng', 10000)">

    <h4>Keranjang Kamu</h4>
    <table>
   
     </table>

<!-- Asal Pesanan -->
      <div class="form-group" style="margin-top:15px;">
                    <select id="asal" onchange="toggleSched(); checkForm()">
                        <option value="">-- Pilih Opsi Pesanan --</option>
                        <option value="Walk-in">🚶 Walk-In</option>
                        <option value="Jadwal">📅 Web (Penjadwalan)</option>
                        <option value="Ojol">🛵 Ojek Online</option>
                    </select>
     </div>

     <!-- Untuk penjadwalan -->
      <div id="waktu-penjadwalan" style="display: none; margin-top: 15px; padding: 12px; background-color: #fff; border: 1px solid #e1dbd6; border-radius: 6px;">
        <p style="font-size: 13px; font-weight: 600; color: #4a3c31; margin-bottom: 8px;">Pilih Waktu Pengambilan (09:00AM - 09:00PM):</p>
        <input type="time" id="waktu-jadwal" min="09:00" max="21.00" oninput="checkForm()" style="width: 100%; padding: 8px; border: 1px solid #e1dbd6; border-radius: 4px; outline: none; font-family: inherit;">
        <p id="error-waktu" style="color: #d32f2f; font-size: 12px; margin-top: 6px; display: none;">Waktu di luar jam operasional!</p>
    </div>

<!-- Konfirmasi Pesanan -->
